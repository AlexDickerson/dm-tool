name: Build

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # -- Python: build the standalone map-tagger.exe --
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build map-tagger exe
        working-directory: tagger
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -q -e . pyinstaller
          .venv\Scripts\pyinstaller --onefile --name map-tagger --paths src entry.py --distpath dist -y

      # -- Node: build the Electron app --
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # electron-rebuild runs via postinstall, but ensure native modules
      # are rebuilt for the correct Electron headers.
      - run: npm run rebuild-sqlite

      - run: npm run build

      - run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: dm-tool-windows
          path: dist/*.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
