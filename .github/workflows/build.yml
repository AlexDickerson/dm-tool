name: Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      should_release: ${{ steps.check.outputs.SHOULD_RELEASE }}

    steps:
      - uses: actions/checkout@v6

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.VERSION }}" > /dev/null 2>&1; then
            echo "SHOULD_RELEASE=false" >> "$GITHUB_OUTPUT"
          else
            echo "SHOULD_RELEASE=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    runs-on: windows-latest
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'

    steps:
      - uses: actions/checkout@v6

      # -- Python: build the standalone map-tagger.exe --
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build map-tagger exe
        working-directory: tagger
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -q -e . pyinstaller
          .venv\Scripts\pyinstaller --onefile --name map-tagger --paths src entry.py --distpath dist -y

      # -- Download Auto-Wall exe from latest release --
      - name: Download Auto-Wall exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.4.0-cli --repo AlexDickerson/auto-wall --pattern "Auto-Wall.exe" --dir auto-wall-bin

      # -- Node: build the Electron app and publish to GitHub Releases --
      # electron-builder --publish always creates the GitHub release and
      # uploads the installer + latest.yml (needed by electron-updater).
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run rebuild-sqlite

      - run: npm run build

      - name: Package and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
