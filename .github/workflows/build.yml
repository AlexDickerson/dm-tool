name: Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      should_release: ${{ steps.check.outputs.SHOULD_RELEASE }}

    steps:
      - uses: actions/checkout@v6

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.VERSION }}" > /dev/null 2>&1; then
            echo "SHOULD_RELEASE=false" >> "$GITHUB_OUTPUT"
          else
            echo "SHOULD_RELEASE=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    runs-on: windows-latest
    needs: check-version

    steps:
      - uses: actions/checkout@v6

      # -- Python: build the standalone map-tagger.exe --
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build map-tagger exe
        working-directory: tagger
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -q -e . "nuitka[onefile]"
          .venv\Scripts\python -m nuitka --onefile --assume-yes-for-downloads --output-filename=map-tagger.exe --output-dir=dist --include-package=dnd_map_tagger --windows-console-mode=force --remove-output entry.py

      # -- Download Auto-Wall exe from latest release --
      - name: Download Auto-Wall exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.4.0-cli --repo AlexDickerson/auto-wall --pattern "Auto-Wall.exe" --dir auto-wall-bin

      # -- Node: build the Electron app --
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run rebuild-sqlite

      - run: npm --workspace dm-tool run package:ci
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: dm-tool-windows
          path: 'dist/DM Tool Setup *.exe'

  release:
    runs-on: ubuntu-latest
    needs: [check-version, build-windows]
    if: needs.check-version.outputs.should_release == 'true'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dm-tool-windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: DM Tool v${{ needs.check-version.outputs.version }}
          files: '*.exe'
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
