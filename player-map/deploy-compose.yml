# Deploy-ready compose file — uses the pre-built dist/ directly with nginx,
# plus the live-sync sidecar alongside it.
#
# Usage:
#   scp -r player-map alex@server.ad:~/player-map
#   scp -r sidecar    alex@server.ad:~/player-map/../sidecar
#   ssh alex@server.ad "cd ~/player-map && \
#     SIDECAR_SECRET=... docker compose -f deploy-compose.yml up -d"

services:
  player-map:
    image: nginx:alpine
    container_name: player-map
    restart: unless-stopped
    ports:
      - '30002:80'
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Override data.json with the DM-exported version (if present)
      - ./data.json:/usr/share/nginx/html/data.json:ro
    depends_on:
      - sidecar

  sidecar:
    build: ../sidecar
    container_name: player-map-sidecar
    restart: unless-stopped
    environment:
      PORT: '30003'
      HOST: '0.0.0.0'
      DATA_DIR: '/data'
      SHARED_SECRET: '${SIDECAR_SECRET:?SIDECAR_SECRET must be set}'
    volumes:
      - ./sidecar-data:/data
    expose:
      - '30003'
