server {
    listen 80;
    root /usr/share/nginx/html;

    # Serve the SPA — fallback to index.html for client-side routing
    location / {
        try_files $uri /index.html;
    }

    # Reverse proxy for the Golarion map tile server.
    # Avoids CORS issues — the browser sees tiles coming from the same origin.
    location /map/ {
        proxy_pass https://map.pathfinderwiki.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host map.pathfinderwiki.com;
        proxy_set_header Accept-Encoding "";

        # Cache tiles locally so repeat requests are fast
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;

        # Allow range requests (PMTiles needs these)
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
}
