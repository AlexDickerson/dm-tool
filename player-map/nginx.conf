server {
    listen 80;
    root /usr/share/nginx/html;

    # Serve the SPA — fallback to index.html for client-side routing
    location / {
        try_files $uri /index.html;
    }

    # Reverse proxy to the live-sync sidecar for inventory + aurus. WebSocket
    # upgrades are forwarded via the Upgrade/Connection headers. The sidecar
    # listens on :30003 by default; override via docker-compose if needed.
    location /api/ {
        proxy_pass http://sidecar:30003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Reverse proxy for the Golarion map tile server.
    # Avoids CORS issues — the browser sees tiles coming from the same origin.
    location /map/ {
        proxy_pass https://map.pathfinderwiki.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host map.pathfinderwiki.com;
        proxy_set_header Accept-Encoding "";

        # Cache tiles locally so repeat requests are fast
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;

        # Allow range requests (PMTiles needs these)
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
}

# WebSocket upgrade header mapping. Nginx needs this to forward Upgrade
# headers through the proxy_pass; it's context-global and must sit outside
# the server { } block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
